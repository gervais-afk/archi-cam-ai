events { worker_connections 1024; }

http {
  upstream fastmcp {
    server fastmcp:8000;
  }

  server {
    listen 80;
    server_name vps.archicamai.cm;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name vps.archicamai.cm;

    ssl_certificate /etc/letsencrypt/live/vps.archicamai.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.archicamai.cm/privkey.pem;

    client_max_body_size 200M;

    location / {
      proxy_pass http://fastmcp/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
    }

    location /health {
      proxy_pass http://fastmcp/health;
    }
  }
}
