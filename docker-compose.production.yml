version: "3.9"

services:
  fastmcp:
    build:
      context: .
      dockerfile: Dockerfile.fastmcp
    container_name: archicam_fastmcp_prod
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-ArchiCamNeo4j2026!}
      - DUCKDB_PATH=/data/archi_cam_ai.duckdb
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/data
      - ./public/assets:/app/public/assets
      - ./projects:/app/projects
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  neo4j:
    image: neo4j:5.20-community
    container_name: archicam_neo4j_prod
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-ArchiCamNeo4j2026!}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: archicam_nginx_prod
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - fastmcp
    restart: unless-stopped

volumes:
  neo4j_data:
